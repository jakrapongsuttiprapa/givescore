<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประเมินเพื่อนร่วมกลุ่ม</title>
<style>
  :root {
    --bg: #F3F4EC;
    --surface: #FFFFFF;
    --surface-soft: #FBFAF5;
    --ink: #20302B;
    --ink-soft: #55645C;
    --muted: #8B9990;
    --border: #DCE3D7;
    --primary: #3C6E58;
    --primary-dark: #2A5443;
    --accent: #C9932E;
    --danger: #B5453A;
    --danger-bg: #F7E8E6;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font: 'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', -apple-system, 'Segoe UI', Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea, select { font-family: inherit; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .mock-banner {
    background: #FBF0D9; color: #7A5A12; font-size: 13px; font-weight: 600;
    padding: 9px 16px; text-align: center; border-bottom: 1px solid #EBD9A8;
  }
  .topbar { padding: 20px 20px 4px; text-align: center; position: relative; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .admin-link { position: absolute; top: 18px; right: 16px; font-size: 12px; font-weight: 700; color: var(--muted); text-decoration: none; padding: 5px 9px; border-radius: 999px; }
  .admin-link:hover { color: var(--primary); background: var(--surface); }

  .container { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 16px 18px 40px; display: flex; flex-direction: column; }
  .container.wide { max-width: 920px; }

  .screen-heading { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
  .screen-sub { font-size: 15px; color: var(--ink-soft); margin: 0 0 20px; }

  .progress-track { display: flex; gap: 6px; margin: 4px 0 22px; }
  .progress-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .progress-seg.done { background: var(--primary); }

  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .choice-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius-md); padding: 16px 18px;
    cursor: pointer; text-align: left; width: 100%;
    font-size: 17px; font-weight: 600; color: var(--ink);
    transition: border-color .15s, transform .1s;
  }
  .choice-card:active { transform: scale(0.98); }
  .choice-card:hover { border-color: var(--primary); }
  .choice-card.is-done { background: var(--surface-soft); color: var(--ink-soft); }
  .choice-card.is-done .group-meta { color: var(--primary); }

  .all-done-note { background: #E8F0EA; color: var(--primary-dark); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .notice-box { background: #FBF0D9; color: #7A5A12; border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
  }
  .group-meta { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: auto; }

  .btn {
    font-size: 16px; font-weight: 700; border: none; border-radius: var(--radius-sm);
    padding: 14px 20px; cursor: pointer; transition: opacity .15s, transform .1s, background .15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); }
  .btn-text { background: none; color: var(--primary); padding: 8px 4px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; }
  .btn-danger-text { background: none; color: var(--danger); font-weight: 700; padding: 6px 4px; font-size: 13px; border: none; cursor: pointer; margin-left: auto; }
  .btn-block { width: 100%; }

  .back-link {
    align-self: flex-start; background: none; border: none; color: var(--ink-soft);
    font-size: 14px; font-weight: 700; cursor: pointer; padding: 6px 0 14px;
  }

  .rating-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 12px; }
  .rating-group-header { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; }
  .rating-group-header:first-child { margin-top: 0; }
  .rating-group-header .label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .rating-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .rating-card-name { font-size: 18px; font-weight: 700; }

  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper-btn {
    width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--border);
    background: var(--surface-soft); font-size: 22px; font-weight: 700; color: var(--primary);
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none;
  }
  .stepper-btn:active { background: var(--primary); color: #fff; }
  .stepper-mid { flex: 1; text-align: center; }
  .stepper-value { font-size: 34px; font-weight: 800; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stepper-value.unset { color: var(--muted); font-size: 16px; font-weight: 600; }
  .stepper-fill-track { height: 6px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .stepper-fill-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .15s; }

  .sticky-footer { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 65%, transparent); padding: 18px 0 4px; margin-top: 8px; }
  .progress-note { text-align: center; font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-weight: 700; }

  .center-block { text-align: center; margin: auto 0; padding: 40px 0; }
  .center-icon { font-size: 46px; margin-bottom: 14px; }
  .center-title { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  .center-sub { font-size: 15px; color: var(--ink-soft); line-height: 1.6; }

  input[type=text], input[type=password], textarea {
    font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); width: 100%; background: var(--surface); color: var(--ink);
  }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }

  .field-label { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; display: block; }
  .field-group { margin-bottom: 14px; text-align: left; }
  .error-text { color: var(--danger); font-size: 14px; font-weight: 600; margin: 8px 0 0; }
  .helper-text { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .success-text { font-size: 13px; color: var(--primary); font-weight: 700; margin-top: 8px; }

  .tabs { display: flex; border-bottom: 1.5px solid var(--border); margin-bottom: 22px; }
  .tab-btn {
    background: none; border: none; padding: 12px 6px; margin-right: 24px; font-size: 16px; font-weight: 700;
    color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  .panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 18px; }
  .panel-title { font-size: 17px; font-weight: 700; margin: 0 0 12px; }

  .group-block { border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; background: var(--surface); }
  .group-block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .group-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .group-block-name { font-size: 17px; font-weight: 700; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 14px; font-weight: 600; }
  .chip-x { cursor: pointer; color: var(--muted); font-weight: 700; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: none; font-size: 14px; padding: 0; }
  .chip-x:hover { background: var(--danger-bg); color: var(--danger); }

  .inline-add { display: flex; gap: 8px; }
  .inline-add input { flex: 1; }

  .result-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); background: none; border-left: none; border-right: none; border-bottom: none; width: 100%; cursor: pointer; text-align: left; }
  .result-row:first-of-type { border-top: none; }
  .result-name { font-weight: 700; flex: 1; font-size: 15px; }
  .result-avg { font-size: 17px; font-weight: 800; color: var(--primary); white-space: nowrap; }
  .result-count { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .result-detail { padding: 2px 0 12px; }
  .result-detail-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 4px 0; color: var(--ink-soft); }
  .result-detail-row .name { flex: 1; }
  .result-detail-reset { background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; padding: 2px 6px; white-space: nowrap; }
  .result-detail-reset:hover { color: var(--danger); }

  .pin-screen { display: flex; align-items: center; justify-content: center; flex: 1; padding: 20px; }
  .pin-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 32px 26px; max-width: 320px; width: 100%; text-align: center; }

  @media (max-width: 420px) {
    .screen-heading { font-size: 21px; }
    .rating-card { padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==========================================================================
// วางลิงก์ Web App ของ Google Apps Script ที่ deploy แล้วตรงนี้
// ถ้าปล่อยว่างไว้ แอปจะรันในโหมดตัวอย่าง (ข้อมูลอยู่ในเครื่อง หายเมื่อรีเฟรช)
// ==========================================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzX472-reBNNz0nZDZ0yXukqTNypIVzbfQOBVZf53RiKe8QUUYh3QOOAoEoc87sDSy8sA/exec';

const isMock = !GAS_URL;

// ---------------- Real GAS transport ----------------
async function gasGet(action, params) {
  try {
    const url = new URL(GAS_URL);
    url.searchParams.set('action', action);
    Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    return await res.json();
  } catch (err) {
    return { ok: false, error: 'network' };
  }
}
async function gasPost(action, body) {
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, body)) });
    return await res.json();
  } catch (err) {
    return { ok: false, error: 'network' };
  }
}

// ---------------- Mock in-memory backend (preview mode) ----------------
const mock = { groups: [], scores: [], pin: '7846', maxScore: 20 };
function seedMockData() {
  const g1 = { id: 'demo_g1', name: 'กลุ่ม 1 (ตัวอย่าง)', members: [
    { id: 'demo_g1_m1', name: 'พลอย' }, { id: 'demo_g1_m2', name: 'ต้น' },
    { id: 'demo_g1_m3', name: 'แนน' }, { id: 'demo_g1_m4', name: 'ฟลุ๊ค' }
  ] };
  const g2 = { id: 'demo_g2', name: 'กลุ่ม 2 (ตัวอย่าง)', members: [
    { id: 'demo_g2_m1', name: 'มายด์' }, { id: 'demo_g2_m2', name: 'บอส' }, { id: 'demo_g2_m3', name: 'ปาล์ม' }
  ] };
  mock.groups = [g1, g2];
  // Demo ratings all come from members of a DIFFERENT group than the target,
  // matching the rule that students rate other groups only.
  mock.scores = [
    { groupId: g1.id, evaluatorId: g2.members[0].id, evaluatorName: 'มายด์', targetId: g1.members[0].id, targetName: 'พลอย', score: 19 },
    { groupId: g1.id, evaluatorId: g2.members[1].id, evaluatorName: 'บอส', targetId: g1.members[0].id, targetName: 'พลอย', score: 17 },
    { groupId: g1.id, evaluatorId: g2.members[2].id, evaluatorName: 'ปาล์ม', targetId: g1.members[0].id, targetName: 'พลอย', score: 20 }
  ];
}
seedMockData();
function mockDelay() { return new Promise(r => setTimeout(r, 200)); }
function mockFindMemberGroup(memberId) {
  for (const g of mock.groups) {
    if (g.members.some(m => m.id === memberId)) return { groupId: g.id, groupName: g.name };
  }
  return null;
}

const mockApi = {
  async getGroups() { await mockDelay(); return { ok: true, groups: mock.groups, maxScore: mock.maxScore }; },
  async submittedGroups(evaluatorId) {
    await mockDelay();
    const ids = [];
    mock.scores.forEach(s => {
      if (s.evaluatorId === evaluatorId && s.groupId && ids.indexOf(s.groupId) === -1) ids.push(s.groupId);
    });
    return { ok: true, groupIds: ids };
  },
  async submitScores(evaluatorId, evaluatorName, ratings) {
    await mockDelay();
    const ownGroup = mockFindMemberGroup(evaluatorId);
    const ownGroupId = ownGroup ? ownGroup.groupId : null;
    let written = 0, skipped = 0;
    ratings.forEach(r => {
      let score = Number(r.score); if (isNaN(score)) score = 0;
      score = Math.max(0, Math.min(mock.maxScore, score));
      const targetGroup = mockFindMemberGroup(r.targetId);
      const groupId = targetGroup ? targetGroup.groupId : '';
      if (r.targetId === evaluatorId || (ownGroupId && groupId === ownGroupId)) { skipped++; return; }
      const existing = mock.scores.find(s => s.evaluatorId === evaluatorId && s.targetId === r.targetId);
      if (existing) existing.score = score;
      else mock.scores.push({ groupId, evaluatorId, evaluatorName, targetId: r.targetId, targetName: r.targetName, score });
      written++;
    });
    if (written === 0 && skipped > 0) return { ok: false, error: 'own_group_not_allowed' };
    return { ok: true, skipped };
  },
  async setMaxScore(maxScore, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    const value = Math.floor(Number(maxScore));
    if (!value || isNaN(value) || value < 1 || value > 1000) return { ok: false, error: 'invalid_max_score' };
    mock.maxScore = value;
    return { ok: true, maxScore: value };
  },
  async checkPin(pin) { await mockDelay(); return { ok: true, valid: String(pin) === String(mock.pin) }; },
  async getResults(pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    const byTarget = {};
    mock.scores.forEach(s => {
      if (!byTarget[s.targetId]) byTarget[s.targetId] = [];
      byTarget[s.targetId].push({ evaluatorId: s.evaluatorId, evaluatorName: s.evaluatorName, score: s.score });
    });
    const results = {};
    Object.keys(byTarget).forEach(tid => {
      const entries = byTarget[tid];
      const sum = entries.reduce((a, e) => a + e.score, 0);
      results[tid] = { count: entries.length, average: sum / entries.length, entries };
    });
    return { ok: true, groups: mock.groups, results, maxScore: mock.maxScore };
  },
  async bulkAddGroups(text, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    let addedGroups = 0, addedMembers = 0, skippedLines = 0;
    const byName = {}; mock.groups.forEach(g => byName[g.name] = g);
    String(text || '').split('\n').forEach(line => {
      line = line.trim(); if (!line) return;
      const idx = line.indexOf(':'); if (idx === -1) { skippedLines++; return; }
      const groupName = line.slice(0, idx).trim();
      const names = line.slice(idx + 1).split(',').map(s => s.trim()).filter(Boolean);
      if (!groupName || !names.length) { skippedLines++; return; }
      let group = byName[groupName];
      if (!group) { group = { id: 'g_' + Math.random().toString(36).slice(2, 8), name: groupName, members: [] }; byName[groupName] = group; mock.groups.push(group); addedGroups++; }
      const existing = new Set(group.members.map(m => m.name));
      names.forEach(n => {
        if (existing.has(n)) return;
        group.members.push({ id: 'm_' + Math.random().toString(36).slice(2, 8), name: n });
        existing.add(n); addedMembers++;
      });
    });
    return { ok: true, addedGroups, addedMembers, skippedLines, groups: mock.groups };
  },
  async renameGroup(groupId, name, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    const g = mock.groups.find(g => g.id === groupId); if (!g) return { ok: false, error: 'group_not_found' };
    g.name = String(name || '').trim() || g.name;
    return { ok: true, groups: mock.groups };
  },
  async deleteGroup(groupId, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    const removedGroup = mock.groups.find(g => g.id === groupId);
    const removedMemberIds = new Set((removedGroup ? removedGroup.members : []).map(m => m.id));
    mock.groups = mock.groups.filter(g => g.id !== groupId);
    mock.scores = mock.scores.filter(s => s.groupId !== groupId && !removedMemberIds.has(s.evaluatorId));
    return { ok: true, groups: mock.groups };
  },
  async addMember(groupId, name, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    const g = mock.groups.find(g => g.id === groupId); if (!g) return { ok: false, error: 'group_not_found' };
    const name2 = String(name || '').trim(); if (!name2) return { ok: false, error: 'empty_name' };
    g.members.push({ id: 'm_' + Math.random().toString(36).slice(2, 8), name: name2 });
    return { ok: true, groups: mock.groups };
  },
  async removeMember(groupId, memberId, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    const g = mock.groups.find(g => g.id === groupId); if (!g) return { ok: false, error: 'group_not_found' };
    g.members = g.members.filter(m => m.id !== memberId);
    mock.scores = mock.scores.filter(s => s.evaluatorId !== memberId && s.targetId !== memberId);
    return { ok: true, groups: mock.groups };
  },
  async resetEvaluator(evaluatorId, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    mock.scores = mock.scores.filter(s => s.evaluatorId !== evaluatorId);
    return { ok: true };
  },
  async resetGroup(groupId, pin) {
    await mockDelay();
    if (String(pin) !== String(mock.pin)) return { ok: false, error: 'invalid_pin' };
    mock.scores = mock.scores.filter(s => s.groupId !== groupId);
    return { ok: true };
  },
  async changePin(oldPin, newPin) {
    await mockDelay();
    if (String(oldPin) !== String(mock.pin)) return { ok: false, error: 'wrong_pin' };
    mock.pin = String(newPin || '').trim() || mock.pin;
    return { ok: true };
  }
};

const api = {
  getGroups: () => isMock ? mockApi.getGroups() : gasGet('groups'),
  submittedGroups: (evaluatorId) => isMock ? mockApi.submittedGroups(evaluatorId) : gasGet('submittedGroups', { evaluatorId }),
  setMaxScore: (maxScore, pin) => isMock ? mockApi.setMaxScore(maxScore, pin) : gasPost('setMaxScore', { maxScore, pin }),
  submitScores: (evaluatorId, evaluatorName, ratings) => isMock ? mockApi.submitScores(evaluatorId, evaluatorName, ratings) : gasPost('submitScores', { evaluatorId, evaluatorName, ratings }),
  checkPin: (pin) => isMock ? mockApi.checkPin(pin) : gasGet('checkPin', { pin }),
  getResults: (pin) => isMock ? mockApi.getResults(pin) : gasGet('results', { pin }),
  bulkAddGroups: (text, pin) => isMock ? mockApi.bulkAddGroups(text, pin) : gasPost('bulkAddGroups', { text, pin }),
  renameGroup: (groupId, name, pin) => isMock ? mockApi.renameGroup(groupId, name, pin) : gasPost('renameGroup', { groupId, name, pin }),
  deleteGroup: (groupId, pin) => isMock ? mockApi.deleteGroup(groupId, pin) : gasPost('deleteGroup', { groupId, pin }),
  addMember: (groupId, name, pin) => isMock ? mockApi.addMember(groupId, name, pin) : gasPost('addMember', { groupId, name, pin }),
  removeMember: (groupId, memberId, pin) => isMock ? mockApi.removeMember(groupId, memberId, pin) : gasPost('removeMember', { groupId, memberId, pin }),
  resetEvaluator: (evaluatorId, pin) => isMock ? mockApi.resetEvaluator(evaluatorId, pin) : gasPost('resetEvaluator', { evaluatorId, pin }),
  resetGroup: (groupId, pin) => isMock ? mockApi.resetGroup(groupId, pin) : gasPost('resetGroup', { groupId, pin }),
  changePin: (oldPin, newPin) => isMock ? mockApi.changePin(oldPin, newPin) : gasPost('changePin', { oldPin, newPin })
};

// ---------------- State ----------------
const state = {
  screen: 'loading',
  groups: [],
  maxScore: 20,
  selectedSelfId: null,
  selectedTargetGroupId: null,
  submittedGroupIds: [],
  ratings: {},
  submitting: false,
  submitError: '',
  errorMsg: '',
  isAdmin: false,
  adminPin: '',
  adminTab: 'manage',
  adminError: '',
  bulkText: '',
  bulkFeedback: '',
  memberDraftByGroup: {},
  maxScoreDraft: null,
  maxScoreFeedback: '',
  maxScoreError: '',
  results: null,
  resultsLoading: false,
  expandedResultId: null,
  showChangePin: false,
  changePinError: '',
  changePinSuccess: false,
  pinDraftOld: '',
  pinDraftNew: ''
};
let resultsPollTimer = null;

const PALETTE = ['#B8735A', '#5C7A99', '#7C5E82', '#7D8A52', '#4A8A82', '#9C6B9E'];
function groupColor(i) { return PALETTE[i % PALETTE.length]; }
function initials(name) { return (name || '?').trim().charAt(0) || '?'; }
function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function findMemberById(id) {
  for (const g of state.groups) {
    const m = g.members.find(m => m.id === id);
    if (m) return m;
  }
  return null;
}
function ownGroup() {
  return state.groups.find(g => g.members.some(m => m.id === state.selectedSelfId)) || null;
}
// Groups this student is allowed to rate: every group except their own.
// Each is tagged with whether they've already submitted scores for it, so the
// picker can show progress and they can come back for the rest later.
function rateableGroups() {
  const own = ownGroup();
  return state.groups
    .filter(g => (!own || g.id !== own.id) && g.members.length > 0)
    .map(g => ({ ...g, done: state.submittedGroupIds.includes(g.id) }));
}
function targetGroup() {
  return state.groups.find(g => g.id === state.selectedTargetGroupId) || null;
}
function currentTargets() {
  const g = targetGroup();
  return g ? g.members.filter(m => m.id !== state.selectedSelfId) : [];
}
function segTrack(activeCount) {
  let s = '';
  for (let i = 1; i <= 3; i++) s += `<div class="progress-seg ${i <= activeCount ? 'done' : ''}"></div>`;
  return s;
}
function adminLinkUrl() {
  const url = new URL(window.location.href);
  url.searchParams.set('admin', '1');
  return url.toString();
}

const root = document.getElementById('app');

function render() {
  let html = '';
  if (isMock) html += `<div class="mock-banner">โหมดตัวอย่าง — ยังไม่เชื่อมต่อ Google Sheets (ข้อมูลจะหายเมื่อรีเฟรชหน้า)</div>`;
  html += `<div class="topbar"><h1>ประเมินเพื่อนร่วมกลุ่ม</h1>${!state.isAdmin ? `<a class="admin-link" href="${esc(adminLinkUrl())}">ครูโอ๊ต</a>` : ''}</div>`;

  switch (state.screen) {
    case 'loading': html += renderLoading(); break;
    case 'noGroups': html += renderNoGroups(); break;
    case 'pickSelf': html += renderPickSelf(); break;
    case 'pickTargetGroup': html += renderPickTargetGroup(); break;
    case 'rating': html += renderRating(); break;
    case 'done': html += renderDone(); break;
    case 'error': html += renderError(); break;
    case 'adminPin': html += renderAdminPin(); break;
    case 'adminMain': html += renderAdminMain(); break;
  }
  root.innerHTML = html;
  attachHandlers();
}

function renderRating() {
  const group = targetGroup();
  const targets = currentTargets();
  const gi = state.groups.findIndex(sg => sg.id === state.selectedTargetGroupId);
  const max = state.maxScore;
  const ratedCount = targets.filter(m => state.ratings[m.id] != null).length;
  const canSubmit = ratedCount > 0;
  const alreadyDone = state.submittedGroupIds.includes(state.selectedTargetGroupId);

  const cards = targets.map(m => {
    const val = state.ratings[m.id];
    const pct = val == null ? 0 : (val / max) * 100;
    return `<div class="rating-card" data-target-id="${esc(m.id)}">
      <div class="rating-card-top">
        <span class="avatar" style="background:${groupColor(gi)}">${esc(initials(m.name))}</span>

        <button type="button" class="stepper-btn" data-step="-1" aria-label="ลดคะแนน">−</button>

        <button type="button" class="stepper-btn" data-step="1" aria-label="เพิ่มคะแนน">+</button>
      </div>
      <div class="stepper-fill-track"><div class="stepper-fill-bar" style="width:${pct}%"></div></div>

  return `<div class="container">

      <div class="progress-note">${ratedCount > 0 ? `ให้คะแนนแล้ว ${ratedCount} จาก ${targets.length} คน` : 'ยังไม่ได้ให้คะแนนใครเลย'}</div>

      <button class="btn btn-primary btn-block" type="button" id="submitBtn" ${(!canSubmit || state.submitting) ? 'disabled' : ''}>${state.submitting ? 'กำลังส่ง...' : 'ส่งคะแนน'}</button>

// ---------------- Handlers ----------------
function attachHandlers() {
  const retryBtn = document.getElementById('retryBtn');
  if (retryBtn) retryBtn.addEventListener('click', () => { state.screen = 'loading'; render(); loadGroupsForStudent(); });

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', handleBack);

  document.querySelectorAll('[data-member-id]').forEach(el => {
    el.addEventListener('click', () => handleSelectSelf(el.getAttribute('data-member-id')));
  });

  document.querySelectorAll('[data-target-group-id]').forEach(el => {
    el.addEventListener('click', () => handleSelectTargetGroup(el.getAttribute('data-target-group-id')));
  });

  const moreGroupsBtn = document.getElementById('moreGroupsBtn');
  if (moreGroupsBtn) moreGroupsBtn.addEventListener('click', () => {
    state.selectedTargetGroupId = null; state.ratings = {}; state.submitError = '';
    state.screen = 'pickTargetGroup'; render();
  });

  const restartBtn = document.getElementById('restartBtn');
  if (restartBtn) restartBtn.addEventListener('click', resetToStart);

  attachRatingHandlers();

  const pinSubmitBtn = document.getElementById('pinSubmitBtn');
  if (pinSubmitBtn) pinSubmitBtn.addEventListener('click', handleAdminPinSubmit);
  const pinInput = document.getElementById('pinInput');
  if (pinInput) { pinInput.focus(); pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleAdminPinSubmit(); }); }

  attachAdminMainHandlers();
}

function resetToStart() {
  state.selectedSelfId = null;
  state.selectedTargetGroupId = null;
  state.submittedGroupIds = [];
  state.ratings = {};
  state.submitError = '';
  state.screen = 'pickSelf';
  render();
}

function handleBack() {
  if (state.screen === 'pickTargetGroup') { resetToStart(); return; }
  if (state.screen === 'rating') {
    state.screen = 'pickTargetGroup';
    state.selectedTargetGroupId = null;
    state.ratings = {};
    state.submitError = '';
  }
  render();
}

async function loadGroupsForStudent() {
  try {
    const res = await api.getGroups();
    if (!res.ok) throw new Error(res.error || 'load_failed');
    state.groups = res.groups || [];
    if (res.maxScore) state.maxScore = res.maxScore;
    state.screen = state.groups.length ? 'pickSelf' : 'noGroups';
  } catch (err) {
    state.screen = 'error';
    state.errorMsg = 'โหลดรายชื่อกลุ่มไม่สำเร็จ';
  }
  render();
}

async function handleSelectSelf(memberId) {
  state.selectedSelfId = memberId;
  state.screen = 'loading';
  render();
  try {
    const res = await api.submittedGroups(memberId);
    if (!res.ok) throw new Error('check_failed');
    state.submittedGroupIds = res.groupIds || [];
    state.screen = 'pickTargetGroup';
  } catch (err) {
    state.screen = 'error';
    state.errorMsg = 'ตรวจสอบสถานะไม่สำเร็จ';
  }
  render();
}

function handleSelectTargetGroup(groupId) {
  state.selectedTargetGroupId = groupId;
  state.ratings = {};
  currentTargets().forEach(m => { state.ratings[m.id] = null; });
  state.submitError = '';
  state.screen = 'rating';
  render();
}

function attachRatingHandlers() {
  document.querySelectorAll('.rating-card').forEach(card => {
    const targetId = card.getAttribute('data-target-id');
    const valueEl = card.querySelector('.stepper-value');
    const fillEl = card.querySelector('.stepper-fill-bar');

    function applyDelta(delta) {
      const max = state.maxScore;
      let cur = state.ratings[targetId];
      cur = cur == null ? 0 : cur;
      cur = Math.max(0, Math.min(max, cur + delta));
      state.ratings[targetId] = cur;
      valueEl.textContent = cur;
      valueEl.classList.remove('unset');
      fillEl.style.width = ((cur / max) * 100) + '%';
      updateSubmitState();
    }

    card.querySelectorAll('.stepper-btn').forEach(btn => {
      const delta = parseInt(btn.getAttribute('data-step'), 10);
      let holdTimeout = null, holdInterval = null;
      const start = (ev) => {
        ev.preventDefault();
        applyDelta(delta);
        holdTimeout = setTimeout(() => { holdInterval = setInterval(() => applyDelta(delta), 90); }, 450);
      };
      const stop = () => { clearTimeout(holdTimeout); clearInterval(holdInterval); };
      btn.addEventListener('mousedown', start);
      btn.addEventListener('touchstart', start, { passive: false });
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => btn.addEventListener(ev, stop));
    });
  });

  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', handleSubmitScores);
}

function updateSubmitState() {
  const targets = currentTargets();
  const ratedCount = targets.filter(m => state.ratings[m.id] != null).length;
  const submitBtn = document.getElementById('submitBtn');
  const note = document.querySelector('.progress-note');
  if (note) note.textContent = ratedCount > 0 ? `ให้คะแนนแล้ว ${ratedCount} จาก ${targets.length} คน` : 'ยังไม่ได้ให้คะแนนใครเลย';
  if (submitBtn) submitBtn.disabled = ratedCount === 0 || state.submitting;
}

async function handleSubmitScores() {
  if (state.submitting) return;
  const rated = currentTargets().filter(m => state.ratings[m.id] != null);
  if (rated.length === 0) return;
  const group = targetGroup();
  if (!window.confirm(`ส่งคะแนนให้ ${rated.length} คนในกลุ่ม "${group ? group.name : ''}" ใช่ไหม?`)) return;
  const ratings = rated.map(m => ({ targetId: m.id, targetName: m.name, score: state.ratings[m.id] }));
  state.submitting = true;
  state.submitError = '';
  render();
  try {
    const selfMember = findMemberById(state.selectedSelfId);
    const res = await api.submitScores(state.selectedSelfId, selfMember.name, ratings);
    if (!res.ok) throw new Error(res.error || 'submit_failed');
    if (!state.submittedGroupIds.includes(state.selectedTargetGroupId)) {
      state.submittedGroupIds.push(state.selectedTargetGroupId);
    }
    state.screen = 'done';
  } catch (err) {
    state.submitError = err.message === 'own_group_not_allowed'
      ? 'ให้คะแนนกลุ่มของตัวเองไม่ได้'
      : 'ส่งคะแนนไม่สำเร็จ ลองใหม่อีกครั้ง';
  }
  state.submitting = false;
  render();
}

function handleAdminActionError(error) {
  if (error === 'invalid_pin') {
    stopResultsPolling();
    state.screen = 'adminPin';
    state.adminError = 'รหัสผ่านหมดอายุ กรุณาเข้าสู่ระบบใหม่';
  } else if (error === 'network') {
    window.alert('เชื่อมต่อไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  } else if (error) {
    window.alert('เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');
  }
}

async function handleAdminPinSubmit() {
  const pinInput = document.getElementById('pinInput');
  const pin = pinInput.value.trim();
  if (!pin) return;
  const btn = document.getElementById('pinSubmitBtn');
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
  const res = await api.checkPin(pin);
  if (res.ok && res.valid) {
    state.adminPin = pin;
    state.adminError = '';
    state.screen = 'adminMain';
    state.adminTab = 'manage';
    await loadGroupsForAdmin();
  } else if (res.ok) {
    state.adminError = 'รหัสผ่านไม่ถูกต้อง';
    render();
  } else {
    state.adminError = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง';
    render();
  }
}

async function loadGroupsForAdmin() {
  const res = await api.getGroups();
  if (res.ok) {
    state.groups = res.groups || [];
    if (res.maxScore) state.maxScore = res.maxScore;
  }
  render();
}

async function loadResults() {
  state.resultsLoading = true;
  const res = await api.getResults(state.adminPin);
  state.resultsLoading = false;
  if (res.ok) {
    state.results = res.results;
    if (res.groups) state.groups = res.groups;
    if (res.maxScore) state.maxScore = res.maxScore;
    render();
  } else {
    handleAdminActionError(res.error);
    render();
  }
}
function startResultsPolling() {
  stopResultsPolling();
  resultsPollTimer = setInterval(() => {
    if (state.screen === 'adminMain' && state.adminTab === 'results') loadResults();
    else stopResultsPolling();
  }, 3000);
}
function stopResultsPolling() {
  if (resultsPollTimer) { clearInterval(resultsPollTimer); resultsPollTimer = null; }
}

function attachAdminMainHandlers() {
  const changePinToggle = document.getElementById('changePinToggle');
  if (changePinToggle) changePinToggle.addEventListener('click', () => {
    state.showChangePin = !state.showChangePin; state.changePinError = ''; state.changePinSuccess = false; render();
  });
  const cancelPinBtn = document.getElementById('cancelPinBtn');
  if (cancelPinBtn) cancelPinBtn.addEventListener('click', () => { state.showChangePin = false; render(); });

  const oldPinInput = document.getElementById('oldPinInput');
  if (oldPinInput) oldPinInput.addEventListener('input', e => { state.pinDraftOld = e.target.value; });
  const newPinInput = document.getElementById('newPinInput');
  if (newPinInput) newPinInput.addEventListener('input', e => { state.pinDraftNew = e.target.value; });

  const savePinBtn = document.getElementById('savePinBtn');
  if (savePinBtn) savePinBtn.addEventListener('click', async () => {
    const oldPin = document.getElementById('oldPinInput').value.trim();
    const newPin = document.getElementById('newPinInput').value.trim();
    if (!newPin) { state.changePinError = 'กรุณากรอกรหัสผ่านใหม่'; render(); return; }
    const res = await api.changePin(oldPin, newPin);
    if (res.ok) {
      state.adminPin = newPin; state.changePinSuccess = true; state.changePinError = '';
      state.pinDraftOld = ''; state.pinDraftNew = '';
    } else {
      state.changePinError = res.error === 'wrong_pin' ? 'รหัสผ่านเดิมไม่ถูกต้อง' : 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
    }
    render();
  });

  document.querySelectorAll('.tab-btn').forEach(el => {
    el.addEventListener('click', () => {
      state.adminTab = el.getAttribute('data-tab');
      state.bulkFeedback = '';
      state.maxScoreFeedback = '';
      state.maxScoreError = '';
      stopResultsPolling();
      render();
      if (state.adminTab === 'results') { loadResults(); startResultsPolling(); }
    });
  });

  const maxScoreInput = document.getElementById('maxScoreInput');
  if (maxScoreInput) maxScoreInput.addEventListener('input', e => { state.maxScoreDraft = e.target.value; });

  const saveMaxScoreBtn = document.getElementById('saveMaxScoreBtn');
  if (saveMaxScoreBtn) saveMaxScoreBtn.addEventListener('click', async () => {
    const value = Number(document.getElementById('maxScoreInput').value);
    state.maxScoreFeedback = '';
    if (!value || isNaN(value) || value < 1 || value > 1000 || Math.floor(value) !== value) {
      state.maxScoreError = 'กรอกเป็นจำนวนเต็ม 1-1000';
      render();
      return;
    }
    const res = await api.setMaxScore(value, state.adminPin);
    if (res.ok) {
      state.maxScore = res.maxScore;
      state.maxScoreDraft = null;
      state.maxScoreError = '';
      state.maxScoreFeedback = `บันทึกแล้ว คะแนนเต็มคือ ${res.maxScore}`;
    } else if (res.error === 'invalid_max_score') {
      state.maxScoreError = 'กรอกเป็นจำนวนเต็ม 1-1000';
    } else {
      state.maxScoreError = '';
      handleAdminActionError(res.error);
    }
    render();
  });

  const bulkText = document.getElementById('bulkText');
  if (bulkText) bulkText.addEventListener('input', e => { state.bulkText = e.target.value; });

  const bulkSaveBtn = document.getElementById('bulkSaveBtn');
  if (bulkSaveBtn) bulkSaveBtn.addEventListener('click', async () => {
    const text = document.getElementById('bulkText').value;
    const res = await api.bulkAddGroups(text, state.adminPin);
    if (res.ok) {
      state.groups = res.groups || state.groups;
      state.bulkText = '';
      state.bulkFeedback = `เพิ่ม ${res.addedGroups} กลุ่มใหม่, ${res.addedMembers} คน${res.skippedLines ? ` (ข้าม ${res.skippedLines} บรรทัดที่รูปแบบไม่ถูกต้อง)` : ''}`;
    } else {
      state.bulkFeedback = '';
      handleAdminActionError(res.error);
    }
    render();
  });

  document.querySelectorAll('[data-rename-id]').forEach(el => {
    el.addEventListener('click', async () => {
      const groupId = el.getAttribute('data-rename-id');
      const group = state.groups.find(g => g.id === groupId);
      const name = window.prompt('ชื่อกลุ่มใหม่', group ? group.name : '');
      if (!name || !name.trim()) return;
      const res = await api.renameGroup(groupId, name.trim(), state.adminPin);
      if (res.ok) state.groups = res.groups; else handleAdminActionError(res.error);
      render();
    });
  });

  document.querySelectorAll('[data-delete-group-id]').forEach(el => {
    el.addEventListener('click', async () => {
      const groupId = el.getAttribute('data-delete-group-id');
      const group = state.groups.find(g => g.id === groupId);
      if (!window.confirm(`ลบกลุ่ม "${group ? group.name : ''}" และคะแนนทั้งหมดของกลุ่มนี้ใช่ไหม?`)) return;
      const res = await api.deleteGroup(groupId, state.adminPin);
      if (res.ok) state.groups = res.groups; else handleAdminActionError(res.error);
      render();
    });
  });

  document.querySelectorAll('[data-add-member-btn]').forEach(el => {
    const groupId = el.getAttribute('data-add-member-btn');
    const input = document.querySelector(`[data-add-member-input="${groupId}"]`);
    if (input) input.addEventListener('input', e => { state.memberDraftByGroup[groupId] = e.target.value; });
    const doAdd = async () => {
      const name = input.value.trim();
      if (!name) return;
      const res = await api.addMember(groupId, name, state.adminPin);
      if (res.ok) { state.groups = res.groups; delete state.memberDraftByGroup[groupId]; } else handleAdminActionError(res.error);
      render();
    };
    el.addEventListener('click', doAdd);
    if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
  });

  document.querySelectorAll('[data-remove-member-id]').forEach(el => {
    el.addEventListener('click', async () => {
      const groupId = el.getAttribute('data-remove-member-group');
      const memberId = el.getAttribute('data-remove-member-id');
      const res = await api.removeMember(groupId, memberId, state.adminPin);
      if (res.ok) state.groups = res.groups; else handleAdminActionError(res.error);
      render();
    });
  });

  const refreshResultsBtn = document.getElementById('refreshResultsBtn');
  if (refreshResultsBtn) refreshResultsBtn.addEventListener('click', loadResults);

  document.querySelectorAll('[data-toggle-result]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-toggle-result');
      state.expandedResultId = state.expandedResultId === id ? null : id;
      render();
    });
  });

  document.querySelectorAll('[data-reset-evaluator-id]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const evaluatorId = el.getAttribute('data-reset-evaluator-id');
      const evaluatorName = el.getAttribute('data-reset-evaluator-name');
      if (!window.confirm(`ล้างคะแนนที่ ${evaluatorName} เคยให้ทั้งหมดใช่ไหม? (${evaluatorName} จะให้คะแนนใหม่ได้)`)) return;
      const res = await api.resetEvaluator(evaluatorId, state.adminPin);
      if (res.ok) loadResults(); else { handleAdminActionError(res.error); render(); }
    });
  });

  document.querySelectorAll('[data-reset-group-id]').forEach(el => {
    el.addEventListener('click', async () => {
      const groupId = el.getAttribute('data-reset-group-id');
      const group = state.groups.find(g => g.id === groupId);
      if (!window.confirm(`ล้างคะแนนทั้งหมดของกลุ่ม "${group ? group.name : ''}" ใช่ไหม? (นักเรียนจะให้คะแนนใหม่ได้)`)) return;
      const res = await api.resetGroup(groupId, state.adminPin);
      if (res.ok) loadResults(); else { handleAdminActionError(res.error); render(); }
    });
  });
}

// ---------------- Init ----------------
function init() {
  state.isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';
  state.screen = state.isAdmin ? 'adminPin' : 'loading';
  render();
  if (!state.isAdmin) loadGroupsForStudent();
}
init();
</script>
